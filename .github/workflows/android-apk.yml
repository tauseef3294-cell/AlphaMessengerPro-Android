name: Build Alpha Messenger Pro APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AlphaMessengerPro_Android_Source.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Extract Android project
        run: unzip -q AlphaMessengerPro_Android_Source.zip
      - name: Build debug APK
        run: gradle -p AlphaMessengerPro_Android :app:assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlphaMessengerPro-debug-apk
          path: AlphaMessengerPro_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
