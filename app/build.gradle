plugins { id 'com.android.application' }
// Firebase config is optional for build validation; add app/google-services.json to activate FCM.
if (file('google-services.json').exists()) apply plugin: 'com.google.gms.google-services'

android {
    namespace 'com.alphamessengerpro.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.alphamessengerpro.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }
    dependencies {
        implementation platform('com.google.firebase:firebase-bom:34.1.0')
        implementation 'com.google.firebase:firebase-messaging'
    }
}
